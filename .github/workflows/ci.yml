name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  LAKE_PKG_URL_MAP: '{"henret":"https://github.com/nabbisen/henret"}'

jobs:
  gate:
    name: 28-step gate (model + runtime + proofs + native + provenance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan + gcc + nc
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gcc netcat-openbsd
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Lean toolchain
        run: elan toolchain install "$(cat lean-toolchain)"
      - name: Run the gate
        run: sh scripts/ci.sh

  sanitizer:
    name: ASan/UBSan native build
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v7
      - name: Install elan + gcc
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gcc
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Lean toolchain
        run: elan toolchain install "$(cat lean-toolchain)"
      - name: Build native shim with sanitizers + run (in runtime package)
        run: |
          IOTAKT_SANITIZE=1 sh scripts/build_native.sh || true
          lake --dir runtime build iotakt-native-test
          ASAN_OPTIONS=detect_leaks=0 runtime/.lake/build/bin/iotakt-native-test
